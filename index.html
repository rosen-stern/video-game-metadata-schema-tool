<head>
<meta charset="UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.34.3/cytoscape.min.js" integrity="sha512-SQebVa91Tn1DeP45Wo74monK/I9wiQg59uKc7P8vp3T7KQ9l5e8IMjZ1GJTgZehUVQt7eS61DTqldQUb1EHfnw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="definitions/engagement-mechanisms.js"></script>

<body>

    <h1>Video Game Metadata Schema Tool</h1>
   
<div class="wrapper-graph">
<div id="cy"></div>

<div id="details">

    <div id="details-empty-state">
        <h2>Select a node to view its description.</h2>
        <p>No node selected.</p>
    </div>    
    
    <div id="details-content">
        <h2 id="term-id">Quiz game</h2>
        <p id="scope-note"></p>
        <div id="further-description-wrapper">
        <p id="examples-p"><b>Examples: </b><span id="examples"></span></p>
        <p id="type-term-p"><b>Type: </b><span id="type-term"></span></p>
        </div>

        <div id="relationship-links-wrapper">
            <div id="use-for-wrapper">
            <h3>Use for</h3>
            <div id="use-for"></div>
                </div>
      
            <div id="broader-term-wrapper">
            <h3>Broader term</h3>
            <div id="broader-term"></div>
                </div>
   
                <div id="narrower-term-wrapper">
            <h3>Narrower term</h3>
            <div id="narrower-term"></div>
                    </div>

                    <div id="related-wrapper">
            <h3>Related</h3>
            <div id="related"></div>
                        </div>

        </div>
    </div>

</div>
</div>



<script src="script.js"></script>

</body>
